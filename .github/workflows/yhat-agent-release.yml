name: Build and Release yhat-agent

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  # Validate tag before any build work starts using a safe single-pass check
  # that does not rely on shell line-by-line processing of untrusted input.
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate semver tag safely
        id: validate
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Tag validation using Bash-native regex with env-passed input.
          # Input is passed via environment variable only — never interpolated directly.
          # Fail closed on any validation error.

          # Length check: min v1.0.0 = 5 chars, max 50 chars
          case ${#TAG} in
            [5-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|50) ;;
            *)
              echo "ERROR: Tag length out of range (got ${#TAG}, expected 5-50)" >&2
              exit 1
              ;;
          esac

          # Anchored Bash-native regex: ^v<num>.<num>.<num>$
          # TAG is supplied only through env — no untrusted expression interpolation.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag '$TAG' is not a valid semver tag (expected vMAJOR.MINOR.PATCH with numeric components)" >&2
            exit 1
          fi

          # Tag is valid — output for downstream jobs
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build yhat-agent
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          output="yhat-agent_${GOOS}_${GOARCH}${EXT}"
          echo "Building ${output}..."
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "${output}" ./cmd/yhat-agent

      - name: Compute checksums
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          # Build the output filename from the exact matrix values.
          # This is safe because matrix values are controlled by the workflow definition,
          # not by user input.
          output="yhat-agent_${GOOS}_${GOARCH}${EXT}"
          checksum_file="${output}.sha256sum"

          # Checksum format: lowercase <64-hex>  <two spaces> <filename> LF
          # OpenSSL is available on all three OS runners (Ubuntu, macOS, Windows).
          # Format matches SHA256SUMS: <hex>  <two spaces><filename>.
          # sha256sum/shasum add an asterisk for binary mode; openssl does not.
          # We parse the openssl output and reformat to match the spec exactly.
          checksum_hex=$(openssl dgst -sha256 -binary "${output}" | xxd -p | tr -d '\n')
          printf '%s  %s\n' "$checksum_hex" "${output}" > "${checksum_file}"

          echo "Checksum computed:"
          cat "${checksum_file}"

      - name: Upload artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yhat-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            yhat-agent_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
            yhat-agent_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}.sha256sum
          retention-days: 30

  verify:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build and verify all platform binaries
        shell: bash
        run: |
          platforms=(
            "linux:amd64:"
            "linux:arm64:"
            "darwin:amd64:"
            "darwin:arm64:"
            "windows:amd64:.exe"
          )
          mkdir -p artifacts
          errors=0
          for entry in "${platforms[@]}"; do
            IFS=':' read -r goos goarch ext <<< "$entry"
            output="yhat-agent_${goos}_${goarch}${ext}"
            echo "Building and verifying $output..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags="-s -w" -o "artifacts/$output" ./cmd/yhat-agent

            checksum_hex=$(openssl dgst -sha256 -binary "artifacts/$output" | xxd -p | tr -d '\n')
            printf '%s  %s\n' "$checksum_hex" "$output" > "artifacts/$output.sha256sum"

            # Self-verify: recompute and compare
            verify_hex=$(openssl dgst -sha256 -binary "artifacts/$output" | xxd -p | tr -d '\n')
            if [ "$checksum_hex" = "$verify_hex" ]; then
              echo "  ✓ $output checksum OK"
            else
              echo "  ✗ $output checksum MISMATCH"
              errors=$((errors + 1))
            fi
          done
          echo ""
          echo "Artifacts built:"
          ls -la artifacts/
          if [ $errors -gt 0 ]; then
            echo "Verification failed with $errors error(s)."
            exit 1
          fi
          echo "All artifacts verified successfully."

  release:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all platform binaries
        shell: bash
        run: |
          platforms=(
            "linux:amd64:"
            "linux:arm64:"
            "darwin:amd64:"
            "darwin:arm64:"
            "windows:amd64:.exe"
          )
          mkdir -p artifacts
          for entry in "${platforms[@]}"; do
            IFS=':' read -r goos goarch ext <<< "$entry"
            output="yhat-agent_${goos}_${goarch}${ext}"
            echo "Building $output..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -ldflags="-s -w" -o "artifacts/$output" ./cmd/yhat-agent

            # Checksum: openssl is available on all runners
            checksum_hex=$(openssl dgst -sha256 -binary "artifacts/$output" | xxd -p | tr -d '\n')
            printf '%s  %s\n' "$checksum_hex" "$output" > "artifacts/$output.sha256sum"
            echo "  Checksum: ${checksum_hex:0:16}..."
          done
          echo ""
          echo "Artifacts built:"
          ls -la artifacts/

      - name: Create combined checksums file
        run: |
          cat artifacts/*.sha256sum > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload to GitHub Release (draft)
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            artifacts/*
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
